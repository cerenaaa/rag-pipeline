name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install sentence-transformers numpy pytest
      - run: python -c "from pipeline.chunker import RecursiveChunker; c=RecursiveChunker(); chunks=c.chunk('Hello world. This is a test.', 'doc_0'); assert len(chunks)>0; print('OK')"